name: deploy-to-composer
# Manual trigger only until a Composer environment and credentials exist. NOT exercised in this repo.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list changes only)"
        type: boolean
        default: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Sync DAGs and plugins
        env:
          COMPOSER_BUCKET: ${{ secrets.COMPOSER_BUCKET }}
        run: ./scripts/deploy_to_composer.sh ${{ inputs.dry_run && '--dry-run' || '' }}
